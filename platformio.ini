; Cardputer ADV browser mirror — ADR 0002
[env:cardputer-adv]
platform  = espressif32@6.9.0
board     = m5stack-stamps3
framework  = arduino
board_build.f_cpu = 240000000L
monitor_speed     = 115200
upload_speed      = 1500000

; ESP32-S3FN8: 8 MB flash, no guaranteed PSRAM. The shadow (63.3 KiB) falls
; back to internal SRAM when PSRAM is absent.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    m5stack/M5GFX
    esp32async/ESPAsyncWebServer@^3.12.0
