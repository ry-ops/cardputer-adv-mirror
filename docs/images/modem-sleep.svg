<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"
     font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <style>
    .lbl{fill:#c9d1d9;font-size:12px}.dim{fill:#8b949e;font-size:10px}
    .ok{fill:#3fb950}.bad{fill:#f85149}.ttl{fill:#e6edf3;font-size:13px;font-weight:700}
  </style>
  <rect fill="#0d1117" width="760" height="300" rx="8"/>
  <text class="ttl" x="20" y="26">Inbound keypress latency — why the display worked and control did not</text>
  <text class="dim" x="20" y="44">Modem sleep parks the receiver between beacons. Transmitting wakes the radio; receiving waits for the next DTIM.</text>

  <rect fill="#161b22" stroke="#30363d" x="20" y="60" width="720" height="95" rx="6"/>
  <text class="lbl" x="34" y="80">BEFORE — <tspan class="bad">WIFI_PS_MIN_MODEM</tspan> (core default, never overridden)</text>
  <text class="bad" x="596" y="80" font-size="11">~100 ms per key</text>
  <line x1="34" y1="128" x2="706" y2="128" stroke="#30363d"/>
  <g stroke="#8b949e">
    <line x1="120" y1="120" x2="120" y2="136"/><line x1="266" y1="120" x2="266" y2="136"/>
    <line x1="412" y1="120" x2="412" y2="136"/><line x1="558" y1="120" x2="558" y2="136"/>
    <line x1="704" y1="120" x2="704" y2="136"/>
  </g>
  <text class="dim" x="106" y="150">DTIM</text><text class="dim" x="252" y="150">DTIM</text>
  <text class="dim" x="398" y="150">DTIM</text><text class="dim" x="544" y="150">DTIM</text>
  <text class="dim" x="40" y="98">key</text>
  <!-- one dot: travels in, HOLDS at the beacon (buffered), then released -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
      path="M 60,105 L 690,105" keyPoints="0;0.327;0.327;1" keyTimes="0;0.22;0.62;0.82"/>
  </circle>
  <text class="bad" x="284" y="109" font-size="11" opacity="0">buffered — waiting for DTIM
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.30;0.58;0.64;1"
             dur="4s" repeatCount="indefinite"/></text>

  <rect fill="#161b22" stroke="#30363d" x="20" y="170" width="720" height="95" rx="6"/>
  <text class="lbl" x="34" y="190">AFTER — <tspan class="ok">WiFi.setSleep(false)</tspan> — receiver always on</text>
  <text class="ok" x="586" y="190" font-size="11">delivered immediately</text>
  <line x1="34" y1="238" x2="706" y2="238" stroke="#30363d"/>
  <g stroke="#21262d">
    <line x1="120" y1="230" x2="120" y2="246"/><line x1="266" y1="230" x2="266" y2="246"/>
    <line x1="412" y1="230" x2="412" y2="246"/><line x1="558" y1="230" x2="558" y2="246"/>
  </g>
  <text class="dim" x="34" y="258">beacons no longer gate delivery</text>
  <text class="dim" x="40" y="208">key</text>
  <circle r="6" fill="#3fb950">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
      path="M 60,215 L 690,215" keyPoints="0;1;1" keyTimes="0;0.22;1"/>
  </circle>

  <text class="dim" x="20" y="288">Outbound tile frames were never affected — transmitting wakes the radio. That asymmetry is the whole symptom.</text>
</svg>
