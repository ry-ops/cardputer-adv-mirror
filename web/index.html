<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ADV Mirror</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#c9d1d9;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--err:#f85149;--accent:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.01em}
.sub{color:var(--dim);font-size:13px;margin-top:-6px}
#shell{background:#1c2128;border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 8px 28px #0009}
canvas{display:block;image-rendering:pixelated;background:#000;border-radius:3px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:760px}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{border-color:var(--ok);color:var(--ok)}
.stat{display:flex;gap:14px;color:var(--dim);font-size:11px;flex-wrap:wrap;justify-content:center}
.stat b{color:var(--fg);font-weight:600}
#kdrop.bad{color:var(--err)}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);vertical-align:middle;margin-right:5px}
#dot.up{background:var(--ok)}
/* Mobile-first: everything above this point is the base (small-screen) size.
 * A mouse-driven, roomier viewport can afford tighter type and controls than
 * a thumb can reliably hit, so this is the one tier that shrinks things back
 * down rather than the usual direction of scaling up for more space. */
@media (min-width:640px){
  body{font-size:13px}
  h1{font-size:16px;font-weight:600;letter-spacing:.02em}
  .sub{font-size:11px;margin-top:-8px}
  button,select{padding:5px 10px;font-size:12px}
  #capbadge{font-size:11px;padding:4px 8px}
}
#kb{display:grid;gap:0;background:#dcdcdc;border:1px solid #b9b9b9;border-radius:9px;padding:9px 8px 7px;width:max-content;max-width:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
/* A physical ADV key is TWO parts, which is the layout fact I had been missing:
 * the legend is printed on the CASE -- forming a continuous light bar across the
 * whole row -- and a separate black rubber dome sits BELOW it. Rendering one
 * flat cap per key produced a generic keyboard, not this keyboard. Geometry is
 * measured from the product photo (docs/adr/0022): 14 uniform columns at a
 * 21.77px pitch, cell aspect 0.769 w/h, dome 64% of cell width and 32% of its
 * height. Row 0 and row 3 dome centres agree within 1px, so there is no stagger
 * and no multi-unit key -- space really is one unit wide. */
.krow{display:grid;grid-template-columns:repeat(14,var(--ku,32px))}
.key{position:relative;height:calc(var(--ku,32px)*1.30);display:flex;flex-direction:column;align-items:stretch;background:transparent;border:0;padding:0;cursor:pointer;user-select:none;box-sizing:border-box}
.key .lgd{position:relative;flex:0 0 53%;background:#ebebeb;color:#15181c;display:flex;align-items:center;justify-content:center;overflow:hidden}
.krow .key:first-child .lgd{border-radius:3px 0 0 3px}
.krow .key:last-child .lgd{border-radius:0 3px 3px 0}
.key .dome{flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.key .dome::after{content:'';width:64%;height:60%;background:#1e201e;border-radius:calc(var(--ku,32px)*0.17)}
.key .pri{font-size:calc(var(--ku,32px)*0.44);font-weight:700;line-height:1;white-space:nowrap}
/* The space cap prints a counterbore mark. U+2334 is absent from common UI
 * fonts (it rendered as a tofu box in the layout check), so draw it from
 * borders -- no font dependency, identical at every unit size. */
.key .spc{width:52%;height:26%;border:solid #15181c;border-width:0 2px 2px 2px;border-radius:0 0 1px 1px}
.key.l2 .pri{font-size:calc(var(--ku,32px)*0.32)}
.key.l3 .pri{font-size:calc(var(--ku,32px)*0.26)}
.key.l5 .pri{font-size:calc(var(--ku,32px)*0.19)}
/* Upper legend: printed small, high-right, in light blue on the real case. */
.key .sec{position:absolute;top:3%;right:7%;font-size:calc(var(--ku,32px)*0.27);font-weight:700;line-height:1;color:#7f9dc0}
.key .sec:hover{color:#0b64d0}
/* Orange is the board's ACCENT colour for special keys (esc, del, the arrows and
 * the fn cap all share it). I first read that as an fn-layer code; it is not --
 * del is orange and dedicated, and ADR 0019 proved the arrows are dedicated too.
 * So this is styling only; the click sends no extra modifier. */
.key .fnl{position:absolute;left:5%;bottom:3%;font-size:calc(var(--ku,32px)*0.30);font-weight:700;line-height:1;color:#e6531f}
.key .fnl:hover{color:#ff7a44}
.key.cap-grey .lgd{background:#c7c7c7}
.key.cap-orange .lgd{background:#e6531f;color:#fff}
.key.cap-blue .lgd{background:#1f5c9e;color:#fff}
.key.cap-green .lgd{background:#3fba93;color:#10251d}
.key.cap-dark .lgd{background:#2c2c2c;color:#fff}
.key.cap-orange .sec,.key.cap-dark .sec{color:#cdd9e6}
.key.cap-orange .fnl,.key.cap-dark .fnl{color:#ffcbb8}
.key:active .dome::after,.key.dn .dome::after{background:#58a6ff}
.key.mod.on .lgd{box-shadow:inset 0 0 0 2px #d29922}
.key.hit .dome::after{box-shadow:0 0 0 2px #3fb950}
/* Top edge: BtnG0, the OFF/ON slide switch, microSD, BtnRst, IR on G44 --
 * physically on the top face, so absent from any front-on view of the board. */
/* Top-edge buttons, rendered as tabs protruding from the case's top edge.
 * They are NOT inside the case: the free band between the case top and the
 * recessed deck is 3.2% of case height -- 6px at a 320px viewport -- which
 * cannot hold a pressable target. Protruding upward also matches how they sit
 * on the physical top face. See ADR 0029.
 * The x-positions are NOT measured: the reference photo is front-on, so the
 * top face does not appear in it. Order follows the documented top-edge layout
 * (BtnG0 ... slide switch ... microSD ... BtnRst ... IR), nothing finer. */
#topedge{position:absolute;left:0;top:0;width:100%;height:0;z-index:3}
#topedge .tbtn{position:absolute;bottom:0;
  /* Proportionally these tabs are 0.020 of case width -- 5.8px at a 320px
   * viewport, far below a pressable target. Scaling faithfully would make the
   * only two hardware buttons on the page unusable on a phone, so height and
   * width take a floor. Fidelity loses to hittability here. */
  width:max(34px, calc(var(--cw)*0.0552));height:max(22px, calc(var(--cw)*0.020));
  /* Sampled from the top-face photo: cap #c4c4c4 seated in a black slot,
   * raised collar #dcdedd around it. Radius ~0.15 of cap width. */
  background:linear-gradient(#cdcdcd,#c4c4c4);border:1px solid #8e9190;
  border-bottom:0;
  border-radius:calc(var(--cw)*0.008) calc(var(--cw)*0.008) 0 0;
  box-shadow:0 -1px 2px #00000026, inset 0 1px 0 #e4e4e4,
             -2px 0 0 #1a1a1a, 2px 0 0 #1a1a1a;
  padding:0;font-size:0;cursor:pointer}
/* MEASURED from the top-face photo (7_f8c26a68-*.webp), superseding the
 * ordering guess in ADR 0029. That photo is MIRRORED relative to the front
 * view -- the S3A sticker sits at 4.3-30.6% there vs 68.4-97.6% in the front
 * photo, and the CARDPUTER ADV silk reads reversed -- so top-view x maps to
 * front-view as (1 - x). Reading the doc's top-edge order straight into a
 * front view had the two buttons on the wrong sides. See ADR 0030. */
#topedge #btng0{left:71.1%}
#topedge #btnrst{left:15.3%}
#topedge .tbtn:hover{background:linear-gradient(#fff,#eee);border-color:var(--accent)}
#topedge .tbtn:active{transform:translateY(1px)}
#topedge .tbtn.rst{border-color:#bda29b}
/* BtnRst is inert (drives EN, cuts SoC power -- firmware cannot actuate it).
 * It must not silently do nothing, so the click surfaces a transient note.
 * Hidden until triggered, so it adds no standing text to the case. */
#g0state{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--cw)*0.026);white-space:nowrap;
  background:#1c2128;color:#e6edf3;border:1px solid #3d444d;border-radius:5px;
  padding:3px 8px;font-size:calc(var(--cw)*0.013);pointer-events:none;
  opacity:0;transition:opacity .15s}
#g0state.show{opacity:1}
.ar{color:var(--ok);font-weight:600}

.note code{color:var(--accent)}
#fmt{border-color:var(--err);color:var(--err)}
#fmt:hover{background:var(--err);color:#0d1117}
#fmt:disabled{opacity:.4;cursor:not-allowed;background:var(--panel);color:var(--err)}
/* ---- Hamburger menu -------------------------------------------------------
 * Occasional controls and streaming diagnostics live behind this. What stays
 * in the bar is what you must see WITHOUT clicking: connection state, zoom,
 * frame budget, and any mode that changes what your physical keyboard does.
 */
.menuwrap{position:fixed;left:16px;top:16px;z-index:60}
/* 44x44 is Apple's own minimum tap target (Human Interface Guidelines); the
 * old 15px/4px9px button measured well under that. Left large at every
 * breakpoint on purpose -- a bigger hit target costs a mouse user nothing. */
#menubtn{font-size:20px;line-height:1;min-width:44px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
#menubtn.open{border-color:var(--accent);color:var(--accent)}
/* Height: the panel is ~270px of content, which clips below the fold on a
 * 568px-tall phone. Cap it to the viewport and scroll rather than letting the
 * Stream numbers fall off the bottom edge with no indication they exist.
 * Width: 250px fixed can overhang the right edge on a ~320px screen, since the
 * panel grows rightward from the button; clamp it to the viewport. */
#menu{position:absolute;left:0;top:calc(100% + 6px);z-index:50;width:250px;
  max-width:calc(100vw - 24px);max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:10px;box-shadow:0 8px 24px #0009;text-align:left}
#menu[hidden]{display:none}
#menu .sect{color:var(--dim);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;margin:10px 0 6px}
#menu .sect:first-child{margin-top:0}
#menu .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
#menu .row button{flex:1 1 auto}
/* Stats keep updating while the menu is open -- that is when you are looking
 * at them. A grid keeps the numbers on a stable column so a changing value
 * does not reflow its neighbours. */
#menu .mstat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;
  font-size:11px;color:var(--dim)}
#menu .mstat b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
/* Modal-state badge: capture rewires the user's PHYSICAL keyboard, so it must
 * be visible with the menu shut. Hidden until active. */
#capbadge{display:none;align-items:center;gap:5px;font-size:13px;
  color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:6px 10px}
#capbadge.on{display:inline-flex}
/* iOS only shows an on-screen keyboard, and only dispatches key/input events
 * at all, once a real editable element has focus -- there is no DOM event to
 * listen for otherwise. This is that element: visually hidden (opacity, not
 * display:none/visibility:hidden, which would make it unfocusable), excluded
 * from Tab order and AT since it carries no visible meaning of its own, and
 * held at 16px so FOCUSING it doesn't trigger iOS's auto-zoom-on-focus (that
 * check reads computed font-size regardless of the element's own visibility).
 * See ADR 0045. */
#mkbInput{position:fixed;top:0;left:0;width:1px;height:1px;padding:0;margin:0;
  border:0;opacity:0;font-size:16px;pointer-events:none}
/* ---- Cardputer ADV mockup -------------------------------------------------
 * Every proportion is MEASURED from the product photo (1200x1200 front-on),
 * not styled by eye. Case bbox 851x547 -> aspect 1.5558. Fractions of case:
 *   glass  left .2479  top .0530  w .2973  h .2779
 *   keys   left .0306  top .4004  w .9365  h .5356   (14 domes, pitch 58.38px
 *                                                     sd 0.35 -> no wide key)
 *   cell   h/w 1.3189   legend .4805 of cell h   dome 24px of 77px pitch
 * Sampled colours: case #e5e7e5, lower case #d3d3d3, inter-row #bfbfbf,
 * legend #e1e7e3, dome #1e1e1e, bezel #0a0c0b.
 * ONE variable drives the whole thing: --cw. Everything else is calc() off it,
 * so the mockup scales as a rigid unit and cannot drift out of proportion.
 */
#dev{--cw:min(820px, calc(100vw - 28px));
  /* Top margin clears the BtnG0/BtnRst tabs, which protrude ABOVE the case
     top edge and would otherwise be clipped against whatever sits above. */
  position:relative;margin-top:max(22px, calc(var(--cw)*0.020));width:var(--cw);height:calc(var(--cw)/1.5558);
  background:linear-gradient(#eceeec 0%,#e5e7e5 38%,#dcdedc 62%,#d3d3d3 100%);
  border-radius:calc(var(--cw)*0.022);
  box-shadow:0 14px 34px #000a, inset 0 1px 0 #fff, inset 0 -2px 4px #0002;
  border:1px solid #c2c4c2;box-sizing:border-box}

/* Recessed upper deck the display and stickers sit on. */
#devtop{position:absolute;left:2.2%;top:3.2%;width:95.6%;height:33.5%;
  background:linear-gradient(#e9ebe9,#dfe1df);
  border-radius:calc(var(--cw)*0.012);box-shadow:inset 0 1px 2px #0000001a}

/* Display glass: measured rectangle. The canvas is positioned INSIDE this. */
#devscreen{position:absolute;left:24.79%;top:5.30%;width:29.73%;height:27.79%;
  background:#0a0c0b;border-radius:calc(var(--cw)*0.006);
  box-shadow:inset 0 0 0 2px #17191a, 0 1px 3px #0006;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* The 240x135 panel is 1.778 but the glass module is 1.664 -- the real bezel is
 * not symmetric. Fit by WIDTH and centre, which is what the hardware does. */
#devscreen canvas{width:100%;height:auto;border-radius:0}

/* Left silk label and right module sticker: simplified, they are printed
 * artwork and carry no state. */
/* MEASURED (ADR 0031). The earlier box was eyeballed and ran 2.2% too low at
 * the bottom, which is what buried the screws. Isolating it needed the scan
 * bounded above the keyboard strip -- that strip is also white, and an
 * unbounded row profile locks onto it instead (returns y 44.79%). */
/* The CARDPUTER ADV label is a PHOTOGRAPH, superseding the CSS reconstruction
 * of ADR 0034. That version was measured correctly -- bracket geometry, cap
 * heights, the 1.158 width correction -- and still did not read as the real
 * label, because the things it could not carry are the ones the eye uses:
 * M5's actual typeface, the printing's slight ink spread, the panel's texture
 * and its soft edge shadow. Measuring the right quantities is not the same as
 * reproducing the artefact. See ADR 0035.
 *
 * Box MEASURED off the panel's own dark border groove, keying on a local dark
 * line with BRIGHTER pixels on both sides -- a plain threshold does not work
 * here (panel fill 232 vs surrounding plastic 214 is only 17 levels apart, and
 * the plastic has a brightness gradient toward the screen, so any global cut
 * either leaks into the case or clips a corner):
 *     x 1.880-22.914%   y 2.559-30.713%
 * The old CSS box was 2.120-23.040% x 2.740-31.080%, close but not measured.
 *
 * object-fit:fill -- the box IS the crop's aspect (1.1613 vs 1.1624), so there
 * is nothing to letterbox. */
#devlabel{position:absolute;left:1.880%;top:2.559%;width:21.034%;height:28.154%;
  border-radius:calc(var(--cw)*0.005);overflow:hidden;
  box-shadow:0 1px 2px #0000001f}
#devlabel img{width:100%;height:100%;display:block;object-fit:fill}
/* The Stamp-S3A module is a PHOTOGRAPH, not CSS (ADR 0033). It carries the
 * real pinout -- GPIO numbers, the BTN/USB legends, the bus-pin column -- and
 * this is a tool whose job is talking to those pins, so inventing plausible
 * artwork here would put wrong pin numbers on screen. The previous rainbow
 * gradient was decorative and admitted as such.
 *
 * Box MEASURED from the product photo off the module's black bezel, with the
 * scan bounded right of the glass (an unbounded dark scan locks onto the
 * screen edge and returns x from 62.5%): x 68.39-99.18%, y 2.19-36.38%.
 * The old box was eyeballed and ran 2.2% short at the top and 4.7% at the
 * bottom. Its left edge, 68.4%, was already right -- an independent check on
 * the measurement.
 *
 * object-fit:fill, not contain: the box IS the crop's own aspect ratio
 * (263x188 = 1.399), so there is nothing to letterbox, and `contain` would
 * silently hide a future aspect mismatch instead of showing it. */
#devsticker{position:absolute;left:68.39%;top:2.19%;width:30.79%;height:34.19%;
  border-radius:calc(var(--cw)*0.004);overflow:hidden}
#devsticker img{display:block;width:100%;height:100%;object-fit:fill}
#devm5{position:absolute;left:60.5%;top:11%;font-size:calc(var(--cw)*0.045);
  font-weight:800;color:#d7d9d7;text-shadow:0 1px 0 #fff,0 -1px 1px #0000001f;
  letter-spacing:-.02em;pointer-events:none}

/* ---- Front-face detail, all MEASURED from the front photo (ADR 0030) ------
 * screws  cx 15.16% / 64.75%, cy 32.81%, d 3.47% of case width
 * mic     icon 9.87-11.05% x, 22.85-27.06% y; grille slots cx ~10.4%
 * silk    cyan registration brackets span 2.59-22.21% x, 4.57-21.76% y
 * The S3A sticker is a dense multicolour pinout label; it is rendered as a
 * tinted panel with a colour band rather than reproduced -- the real artwork
 * is unreadable below ~200px and faking its text would be invented detail. */

/* The mic is printed ON the label (confirmed at magnification), so it is
 * emitted after it. Orange dot measured x 9.87-11.05%, y 22.85-27.06%,
 * colour (243,103,50); the dark cradle around it extends the whole icon to
 * x 8.93-11.87%, y 22.85-29.43%. */
/* MEASURED from the product photo, correcting two errors at once (ADR 0031):
 * the slots sit at y 31.81-35.47%, BELOW the label's bottom edge (31.08%) on
 * bare plastic -- the old 26.0% put them under the label, where they were
 * invisible regardless of colour. And they are BLACK rounded pills, not the
 * orange I had assumed by association with the mic; the darkest 15% of those
 * pixels reads (0,0,0) against (206,206,206) plastic. */
#devgrille{position:absolute;left:9.40%;top:31.81%;width:2.01%;height:3.66%;
  pointer-events:none}
#devgrille i{position:absolute;top:0;height:100%;width:29.9%;background:#0a0a0a;
  border-radius:calc(var(--cw)*0.004)}
#devgrille i.a{left:0}
#devgrille i.b{left:70.1%}


/* Keyboard well. #kb is placed at the measured rectangle and its own --ku is
 * driven from case width, NOT the viewport, so keys stay locked to the case. */
#devkb{position:absolute;left:3.06%;top:40.04%;width:93.65%}
#dev #kb{background:transparent;border:0;border-radius:0;padding:0;
  width:100%;max-width:none}
#dev .krow{grid-template-columns:repeat(14,1fr)}

/* Zoom control: on the case, bottom-right of the deck, near the display. */
/* Zoom sits on the bare deck strip between the glass (ends 54.4%) and the
 * S3A sticker (starts 68.4%) -- 14% of case width -- and below the M5 logo
 * band (11-18%). It is NOT in the gap between deck and keyboard: that gap is
 * 3.34% of case height and the button is taller than it at EVERY viewport
 * width, so it would have overlapped the number row. See ADR 0028. */
#zoombtn{position:absolute;left:55.4%;top:23%;width:12.2%;z-index:4;
  font-size:calc(var(--cw)*0.016);line-height:1.25;padding:3px 0;border-radius:5px;
  background:#f2f4f2;color:#3a3d3a;border:1px solid #c2c4c2;text-align:center;
  white-space:nowrap;overflow:hidden}
#zoombtn:hover{border-color:var(--accent);color:var(--accent)}

/* Popped-out state: the large canvas returns to #shell above the mockup and
 * the glass shows a placeholder rather than an empty black hole. */
#devscreen.out::after{content:'zoomed out';color:#4a4f55;
  font:600 calc(var(--cw)*0.016)/1 ui-monospace,monospace;letter-spacing:.08em}
#shell[hidden]{display:none}
</style></head><body>
<span class="menuwrap">
  <button id="menubtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Display, capture and diagnostics">☰</button>
  <div id="menu" hidden role="menu" aria-label="Display and diagnostics">
    <div class="sect">Display</div>
    <div class="row">
      <button id="full">Full refresh</button>
      <button id="shot">Save PNG</button>
    </div>
    <div class="row">
      <button id="swap">Swap R/B</button>
      <button id="inv">Invert</button>
    </div>
    <div class="sect">Keyboard</div>
    <div class="row">
      <button id="hwkb">Capture my keyboard</button>
    </div>
    <div class="row">
      <button id="sweep">Test all 56 keys</button>
    </div>
    <div class="sect">Stream</div>
    <div class="mstat">
      <span>fps</span><b id="fps">0</b>
      <span>tiles/s</span><b id="tps">0</b>
      <span>KiB/s</span><b id="kbs">0</b>
      <span>tiles</span><b id="tot">0</b>
      <span>self-test</span><b id="st">—</b>
      <span>keys sent</span><b id="ksent">0</b>
      <span>keys dropped</span><b id="kdrop">0</b>
      <span>coverage</span><b id="kcov">0/56</b>
    </div>
  </div>
</span>
<input id="mkbInput" type="text" tabindex="-1" aria-hidden="true"
  autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<h1>ADV Mirror</h1>
<div class="sub">ADR 0002 · GRAM readback · 240×135 RGB565</div>
<!-- #shell precedes #dev in DOM order (ADR 0045) so that when zoom pops the
     canvas out, it renders ABOVE the case mockup instead of below it --
     that's the reachable spot on a phone screen once the keyboard is up. -->
<div id="shell" hidden></div>
<!-- Mockup. Proportions measured from the product photo -- see ADR 0028.
     The canvas MOVES between #devscreen (inset) and #shell (zoomed out); it is
     never duplicated, because two live canvases would double per-frame draw
     cost on a stream already budgeted in ms/tile. -->
<div id="dev">
  <div id="topedge">
    <button class="tbtn" id="btng0" title="BtnG0 — GPIO 0, the only top button firmware can read (M5.BtnA)" aria-label="BtnG0"></button>
    <button class="tbtn rst" id="btnrst" title="BtnRst — drives the EN line, cutting power to the SoC. Physical only." aria-label="BtnRst"></button>
  </div>
  <div id="g0state" role="status"></div>
  <div id="devtop"></div>
  <!-- PAINT ORDER IS LOAD-BEARING: the label is a solid white panel and must be
       emitted BEFORE the screws and grille, which sit on bare plastic BELOW its
       bottom edge and were previously buried under it. The mic is the one detail
       printed ON the label, so it must come AFTER. Verified against the product
       photo at magnification -- see ADR 0031. -->
  <!-- Photograph, on its own route like the S3A module (ADR 0035). The screw
       that overlaps the panel's lower right in the product shot is painted out
       of the crop, since the page draws no screws. -->
  <div id="devlabel"><img src="/advlabel.webp" alt="CARDPUTER ADV label"
       width="180" height="155" decoding="async"></div>
  <div id="devgrille"><i class="a"></i><i class="b"></i></div>
    <div id="devm5">M5</div>
  <!-- Served from its own firmware route, not a base64 data: URI -- see
       ADR 0033. The alt text names the part rather than describing the
       picture, because that is what a reader actually needs from it. -->
  <div id="devsticker"><img src="stamp.webp" alt="M5Stack Stamp-S3A module label with GPIO pinout"
       width="263" height="188" decoding="async"></div>
  <div id="devscreen"><canvas id="c" width="240" height="135"></canvas></div>
  <button id="zoombtn" title="Pop the display out of the case, and back">zoom</button>
  <div id="devkb"><div id="kb"></div></div>
</div>
<!-- The visible bar holds only what you cannot afford to click for: link
     state, zoom, the frame budget (it changes what you are watching), and the
     capture badge, because capture rewires the user's PHYSICAL keyboard and a
     hidden mode toggle is how you lose keystrokes to the wrong window. -->
<div class="bar">
  <span><span id="dot"></span><span id="conn">connecting…</span></span>
  <select id="zoom"><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option><option value="5">5×</option></select>
  <select id="budget">
    <option value="2000">Gentle (2ms)</option>
    <option value="4500" selected>Normal (4.5ms)</option>
    <option value="9000">Fast (9ms)</option>
    <option value="20000">Aggressive (20ms)</option>
  </select>
  <span id="capbadge">⌨ capturing keys<button id="capoff" style="padding:1px 6px;font-size:11px">stop</button></span>
</div>

<!-- The ADV's top face carries controls that appear in NO front-on photo of the
     board: BtnG0, the OFF/ON slide switch, the microSD slot, BtnRst, and the IR
     LED on G44. Only BtnG0 is readable by firmware -- M5Unified registers a
     single button for board_M5CardputerADV (BtnA on GPIO 0). BtnRst drives the
     EN line, which cuts power to the SoC; there is no way for software to
     "press" it, so it is shown as a physical-only control rather than given a
     button that would silently do nothing. -->
<!-- The explanatory note block that stood here was removed at the user's
     request. The facts it carried are not lost: the dual-glyph and arrow-key
     behaviour is documented in ADR 0019, the colour-order and GRAM-readback
     caveats in ADR 0001, and both remain covered by assertions in
     tools/test_dom_keyboard.cjs. Do not reinstate it as page text. -->
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d',{willReadFrequently:true});
cx.imageSmoothingEnabled=false;
let W=240,H=135,TW=60,TH=45,COLS=4;
let img=cx.createImageData(TW,TH);
const $=i=>document.getElementById(i);
// Coarse pointer = touch, no reliable hover -- the signal this page uses to
// decide "does this visitor have a hardware keyboard already." A phone/tablet
// answers false; a laptop trackpad or a desktop mouse answers true. See
// ADR 0045 for why zoom and keyboard capture are coupled behind this check.
const isTouch=matchMedia('(pointer:coarse)').matches;
/* Inset <-> popped-out. The canvas ELEMENT MOVES between hosts; it is never
 * cloned and never duplicated. A second live canvas would double the per-frame
 * blit on a stream whose whole design is a millisecond tile budget, and the two
 * copies would drift whenever one missed a tile.
 * Inset, the canvas fills the measured glass rectangle via CSS (width:100%), so
 * the zoom SELECT only applies when popped out. */
let popped=false;
function zoom(){
  const z=+$('zoom').value;
  if(popped){cv.style.width=(W*z)+'px';cv.style.height=(H*z)+'px';}
  else {cv.style.width='';cv.style.height='';}
}
function setPopped(on){
  popped=on;
  const host = on ? $('shell') : $('devscreen');
  host.appendChild(cv);                 // moves the node, does not copy it
  $('shell').hidden = !on;
  $('devscreen').classList.toggle('out', on);
  $('zoombtn').textContent = on ? 'inset' : 'zoom';
  $('zoom').disabled = !on;             // the select is meaningless when inset
  zoom();
}
$('zoom').onchange=zoom;
// On touch, zoom and keyboard capture are one action: the whole point of
// popping the display out on a phone is to type into it, and hunting down a
// second control to enable that separately just loses the visitor between
// the two steps. Desktop keeps them independent, same as always -- a mouse
// user clicking zoom to look closer should not also start eating their
// physical keystrokes.
$('zoombtn').onclick=()=>{
  const on=!popped;
  setPopped(on);
  if(isTouch) setCapture(on);
};
setPopped(false);
cx.fillStyle='#000';cx.fillRect(0,0,W,H);

let tiles=0,bytes=0,frames=0,total=0;
setInterval(()=>{
  $('fps').textContent=frames;$('tps').textContent=tiles;
  $('kbs').textContent=(bytes/1024).toFixed(1);$('tot').textContent=total;
  tiles=0;bytes=0;frames=0;
},1000);

// RGB565 -> RGBA. Matches Codec.h exactly: little-endian, 5/6/5, replicated
// high bits so 0x1F -> 0xFF rather than 0xF8.
function put(idx,px){
  const d=img.data;
  for(let i=0;i<TW*TH;i++){
    const v=px[i],r=(v>>11)&0x1F,g=(v>>5)&0x3F,b=v&0x1F,o=i<<2;
    d[o]=(r<<3)|(r>>2); d[o+1]=(g<<2)|(g>>4); d[o+2]=(b<<3)|(b>>2); d[o+3]=255;
  }
  cx.putImageData(img,(idx%COLS)*TW,Math.floor(idx/COLS)*TH);
}
function decode(buf){
  const dv=new DataView(buf);
  if(dv.getUint8(0)!==0x54)return;              // 'T'
  const idx=dv.getUint8(1),enc=dv.getUint8(4),cnt=dv.getUint8(5)|(dv.getUint8(6)<<8);
  const px=new Uint16Array(TW*TH);let o=7;
  if(enc===0x00){ for(let i=0;i<cnt;i++){px[i]=dv.getUint8(o)|(dv.getUint8(o+1)<<8);o+=2;} }
  else if(enc===0x01){ let p=0;
    for(let i=0;i<cnt;i++){ const v=dv.getUint8(o)|(dv.getUint8(o+1)<<8),rl=dv.getUint8(o+2);o+=3;
      for(let k=0;k<rl;k++)px[p++]=v; } }
  else return;
  put(idx,px);tiles++;total++;if(idx===0)frames++;
}
let ws;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType='arraybuffer';
  ws.onopen =()=>{$('dot').className='up';$('conn').textContent='connected';};
  ws.onclose=()=>{$('dot').className='';$('conn').textContent='reconnecting…';setTimeout(connect,1200);};
  ws.onmessage=e=>{
    if(typeof e.data==='string'){
      const m=JSON.parse(e.data);
      if(m.t==='hello'){
        W=m.w;H=m.h;TW=m.tw;TH=m.th;COLS=m.cols;
        cv.width=W;cv.height=H;img=cx.createImageData(TW,TH);zoom();
        const s=m.selftest;$('st').textContent=s<0?'n/a':s+'%';
        $('st').style.color=s>=95?'var(--ok)':s>=60?'var(--warn)':'var(--err)';
      }
      return;
    }
    bytes+=e.data.byteLength;decode(e.data);
  };
}
connect();
// Returns whether the frame actually went out. Callers MUST consult it --
// a press made while the socket is down is a dropped press, not a sent one.
const send=o=>{ if(!ws||ws.readyState!==1) return false;
                ws.send(JSON.stringify(o)); return true; };
$('full').onclick=()=>send({full:true});
$('budget').onchange=e=>send({budget:+e.target.value});
let sw=false,iv=false;
$('swap').onclick=e=>{sw=!sw;e.target.classList.toggle('on',sw);send({swaprb:sw});};
$('inv').onclick =e=>{iv=!iv;e.target.classList.toggle('on',iv);send({invert:iv});};
$('shot').onclick=()=>{
  const o=document.createElement('canvas');o.width=W*4;o.height=H*4;
  const g=o.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(cv,0,0,o.width,o.height);
  const a=document.createElement('a');a.download='cardputer-adv.png';a.href=o.toDataURL();a.click();
};

/* ---------------- ADV keyboard: layout + input injection ----------------
 * KEYMAP is GENERATED from the vendor header (tools/gen_keymap.py parses
 * _key_value_map[4][14] out of M5Cardputer's Keyboard.h) and inlined here by
 * gen_web_assets.py. It is deliberately not hand-written: the previous version
 * of this block was transcribed by hand from a photo and carried HID codes that
 * had no relationship to what the firmware actually reads.
 *
 * We send hardware MATRIX COORDINATES {r,c}, not characters. The firmware runs
 * them through the same _key_value_map a physical press uses, so a remote press
 * and a real press are indistinguishable downstream -- there is no second input
 * path that can disagree with the first.
 */
/*__KEYMAP__*/
const kb=$('kb');
const mods={shift:false,fn:false,ctrl:false,alt:false,opt:false};
let keysSent=0,keysDropped=0;

function sendKey(k, forceShift){
  // Modifier keys latch locally instead of being transmitted: the firmware
  // needs them as FLAGS accompanying a key, which is how the hardware reports
  // them too (KeysState.shift/.fn alongside the character).
  if(k.mod){
    mods[k.mod]=!mods[k.mod];
    renderMods();
    return;
  }
  // forceShift: the user clicked the UPPER legend on the cap, which means that
  // symbol specifically -- regardless of the latch state. The device still
  // receives a coordinate plus a shift flag, exactly as a physical press does.
  const sh = forceShift || mods.shift;
  // NO modifier is added for the arrow caps. Their glyphs are printed in the
  // same orange as the fn cap, which I first read as "these are fn-layer
  // chords". They are not: ADR 0019 established the ADV has four DEDICATED
  // arrow keys that report ';' ',' '.' '/' because M5Cardputer reuses the
  // original keymap, and the 56-key sweep proves they land without any
  // modifier. Orange is the board's accent colour for special keys -- 'del' is
  // orange too, and del is plainly dedicated. Sending fn here would make the
  // browser's press differ from a physical one.
  noteSent(k.r,k.c, send({t:'key',r:k.r,c:k.c,shift:sh,fn:mods.fn}));
  // Shift and fn are one-shot, matching how you'd physically chord them.
  if(mods.shift||mods.fn){mods.shift=false;mods.fn=false;renderMods()}
}

// Size the key unit so all 14 columns fit the panel. Row 3 is the widest: 13
// single units + a double-width space bar + 13 gaps. Solving for the unit rather
// than hardcoding one is what GUARANTEES no key is clipped off the right edge --
// the previous fixed 30px key made that row 604px wide in an unwrapped flex
// container, so its tail simply overflowed out of view.
function fitKeyboard(){
  const kb=$('kb'); if(!kb) return;
  // Measure the AVAILABLE space, not the keyboard: #kb is a shrink-to-fit grid
  // item, so its own clientWidth is a function of the unit being computed -- a
  // feedback loop that once latched at the minimum and collapsed the board to a
  // single column (ADR 0021). The viewport is the independent quantity.
  // Inside the mockup the keyboard is locked to the CASE, not the viewport:
  // #devkb is 93.65% of case width and .krow uses 1fr columns, so the grid
  // already tracks the case. --ku still drives FONT sizes on the caps, so it
  // must be derived from the rendered case width or the legends will not scale
  // with the shell they sit in.
  const dev=$('dev');
  const room=dev ? dev.getBoundingClientRect().width*0.9365
                 : (document.documentElement.clientWidth||900)-32;
  const avail=Math.max(300,room);
  // Rows are edge-to-edge with NO gap, matching the photo: the legend bar is
  // continuous across a row. So the width is exactly 14 units.
  const unit=Math.floor(avail/14);
  // The old ceiling of 46 existed to stop a VIEWPORT-driven keyboard growing
  // without bound. Inside the mockup that job belongs to --cw (case width is
  // capped at 820px), and keeping the 46 here would clamp --ku at every desktop
  // width >=768px while the case stayed 820px wide -- undersized legends in
  // full-size caps. Floor stays: a sub-16px key is not clickable.
  const cap = dev ? 999 : 46;
  kb.style.setProperty('--ku',Math.max(16,Math.min(cap,unit))+'px');
}
addEventListener('resize', fitKeyboard);
// The case width is only known after layout, so re-fit once the first
// frame has been laid out; calling it inline reads width 0 on some paths.
requestAnimationFrame(fitKeyboard);

/* Top-edge buttons. BtnG0 is injected as a BUTTON event, not a key event: it is
 * a GPIO, not a matrix coordinate, so pushing it through the keyboard path would
 * require inventing a fake (row,col) that the hardware can never report -- the
 * exact kind of second vocabulary keyinject.h exists to avoid.
 *
 * BtnRst is deliberately inert. It drives EN, which removes power from the SoC;
 * firmware cannot actuate it, and esp_restart() is a DIFFERENT operation (warm
 * reset, no power cycle). Offering it as a working button would misrepresent the
 * hardware, so the click explains itself instead. */
(function(){
  const g0=$('btng0'), rst=$('btnrst'), st=$('g0state');
  /* Both notes are transient: the case carries no standing text, so a note
   * appears on press and fades. BtnRst still explains rather than acting --
   * a control that silently does nothing is worse than one that says why. */
  let noteT=null;
  function note(msg){
    if(!st) return;
    st.textContent=msg; st.classList.add('show');
    clearTimeout(noteT); noteT=setTimeout(()=>st.classList.remove('show'),1800);
  }
  if(rst) rst.onclick=()=>note('BtnRst is physical only (cuts power via EN)');
  if(g0) g0.onpointerdown=e=>{e.preventDefault();
    send({t:'btn',b:'g0',ms:80});
    note('G0 pressed \u2192 sent');
  };
})();

// Browser-side coverage. The device tracks the same thing; comparing the two
// numbers is what separates "browser never sent it" from "device never got it".
const sentMask=new Set();
function noteSent(r,c,ok){
  // MY BUG: this incremented unconditionally, and every caller invoked it
  // immediately after send() without consulting send()'s return. send() is
  //   ws && ws.readyState===1 && ws.send(...)
  // which yields FALSE and transmits nothing when the socket is closed or
  // still connecting -- yet "keys sent" ticked up and the cap lit 'hit'
  // exactly as if it had gone out.
  //
  // The comment directly above this function says these counters exist to
  // separate "browser never sent it" from "device never got it". They could
  // not: the browser counted keys it had dropped on the floor. During a
  // reconnect -- the 1200 ms window after any socket close -- every press is
  // silently discarded while the UI reports success. That is the whole
  // "control does not work" symptom, and it is why it looked like a device
  // problem rather than a page problem.
  if(!ok){ keysDropped++; const d=$('kdrop'); d.textContent=keysDropped;
           d.className='bad'; return; }
  keysSent++; $('ksent').textContent=keysSent;
  sentMask.add(r+','+c);
  $('kcov').textContent=sentMask.size+'/56';
  const el=document.querySelector(`.key[data-rc="${r},${c}"]`);
  if(el) el.classList.add('hit');
}

function renderMods(){
  document.querySelectorAll('.key.mod').forEach(el=>{
    const m=el.dataset.mod;
    el.classList.toggle('on', !!mods[m]);
  });
  // No text readout: `.key.mod.on .lgd` already draws an amber ring on the
  // latched cap, which is where the user is looking when they latch it.
}

if(!window.KEYMAP){
  kb.innerHTML='<div style="color:var(--err);font-size:11px">'+
    'keymap.js not inlined — run tools/gen_keymap.py then tools/gen_web_assets.py</div>';
}else{
 // Cap colours are MEASURED from the product photo, not guessed: median RGB of
 // each legend strip showed only five caps are not bare case plastic --
 // del/fn orange, Aa blue, opt green, enter near-black, and tab/ctrl/alt a
 // slightly darker grey than the case. Everything else is #EBEBEB with ink.
 const CAPCOLOR={'0,13':'orange','2,0':'orange','2,1':'blue','2,13':'dark',
                 '3,1':'green','1,0':'grey','3,0':'grey','3,2':'grey'};
 // Legends printed on the case that are NOT the vendor keymap value. The board
 // prints 'esc' on the ` cap and 'ok' above enter's arrow; both are orange
 // fn-layer functions on ` / enter respectively.
 const FNLEGEND={'0,0':'esc','0,13':'del'};
 window.KEYMAP.forEach(row=>{
  const d=document.createElement('div');d.className='krow';
  row.forEach(k=>{
    const rc=k.r+','+k.c;
    // Space is ONE unit on this board. Measuring the photo's dome centres showed
    // row 0 and row 3 align within a pixel across all 14 columns, so there is no
    // wide key to special-case -- the earlier double-width space bar was mine,
    // not the ADV's.
    const isSpace=(k.r===3 && k.c===13);
    const el=document.createElement('div');
    const lbl=isSpace?'space':(FNLEGEND[rc]||k.lo);
    // Font size follows LABEL LENGTH, the property that actually governs fit.
    const lenCls=lbl.length>4?' l5':lbl.length>2?' l3':lbl.length>1?' l2':'';
    const col=CAPCOLOR[rc];
    el.className='key'+(k.mod?' mod':'')+lenCls+(col?' cap-'+col:'');
    el.dataset.lo=k.lo; el.dataset.hi=k.hi; el.dataset.rc=rc;
    if(k.mod) el.dataset.mod=k.mod;

    const lgd=document.createElement('div'); lgd.className='lgd';
    if(isSpace){
      const sp=document.createElement('div'); sp.className='spc';
      lgd.appendChild(sp);
    }else{
      const pri=document.createElement('span'); pri.className='pri';
      // Letters are printed UPPERCASE on the case even though the key reports
      // lowercase unshifted -- the legend is the cap, the value is the keymap.
      pri.textContent=(lbl.length===1&&/[a-z]/.test(lbl))?lbl.toUpperCase():lbl;
      lgd.appendChild(pri);
    }

    if(!k.mod && !isSpace){
      // A secondary legend is printed ONLY when the shifted value is a DIFFERENT
      // GLYPH. For the 26 letters the vendor map stores lo='q', hi='Q' -- the
      // same character in the other case, which the cap prints once. Rendering
      // hi!==lo naively put a redundant blue 'Q' above every letter, which the
      // real board does not have. Shift is still reachable via the Aa latch.
      const hasSec = k.hi!==k.lo && k.hi.toLowerCase()!==k.lo.toLowerCase();
      if(hasSec){
        const hi=document.createElement('span'); hi.className='sec';
        hi.textContent=k.hi;
        hi.onpointerdown=e=>{e.preventDefault();e.stopPropagation();
          el.classList.add('dn'); sendKey(k,true);};
        hi.onpointerup=()=>el.classList.remove('dn');
        lgd.appendChild(hi);
      }
      if(k.cap){
        // The arrow is a third legend on a shared cap, printed in fn-orange.
        // It is a DEDICATED key (ADR 0019): clicking it sends the bare
        // coordinate, no modifier -- same wire event as clicking the cap.
        const ar=document.createElement('span'); ar.className='fnl';
        ar.textContent=k.cap;
        // Same wire event as clicking the cap -- the arrow needs no modifier.
        ar.onpointerdown=e=>{e.preventDefault();e.stopPropagation();
          el.classList.add('dn'); sendKey(k,false);};
        ar.onpointerup=()=>el.classList.remove('dn');
        lgd.appendChild(ar);
      }
    }
    el.appendChild(lgd);
    const dome=document.createElement('div'); dome.className='dome';
    el.appendChild(dome);

    el.title=`row ${k.r} col ${k.c}  \u00b7  ${k.lo}`+(k.hi!==k.lo?` / ${k.hi}`:'')
            +(k.cap?`  \u00b7  dedicated arrow ${k.cap} (reports '${k.lo}')`:'')
            +(FNLEGEND[rc]?`  \u00b7  cap prints '${FNLEGEND[rc]}'`:'');
    el.onpointerdown=e=>{e.preventDefault();el.classList.add('dn');sendKey(k)};
    el.onpointerup=el.onpointerleave=()=>el.classList.remove('dn');
    d.appendChild(el);
  });
  kb.appendChild(d);
 });
 renderMods();
 fitKeyboard();
}

/* Sweep: press all 56 keys in sequence.
 * This is the answer to "there is no way to test the other keys". Pace it well
 * under the firmware's queue depth (16) and drain rate (8 per loop pass) so the
 * test measures the KEY PATH and not the queue's overflow behaviour -- a sweep
 * that drops events would be indistinguishable from keys that do not work.
 */
$('sweep').onclick=async e=>{
  if(!window.KEYMAP) return;
  const btn=e.target; btn.disabled=true;
  const keys=window.KEYMAP.flat();
  for(const k of keys){
    if(ws.readyState!==1) break;
    noteSent(k.r,k.c, send({t:'key',r:k.r,c:k.c,shift:false,fn:false}));
    const el=document.querySelector(`.key[data-rc="${k.r},${k.c}"]`);
    if(el){el.classList.add('dn');setTimeout(()=>el.classList.remove('dn'),90)}
    await new Promise(r=>setTimeout(r,70));   // 14/s vs ~1000/s drain: 70x headroom
  }
  btn.disabled=false;
  btn.textContent='Sweep done — check device coverage';
};

/* Physical keyboard -> matrix coordinate.
 * Built by inverting KEYMAP, so it too follows the vendor header. Arrow keys
 * are mapped to the fn-chords the ADV actually uses (fn+; . , /), which is the
 * whole point of this exercise: a browser arrow key should reach the menu.
 */
const byChar={};
if(window.KEYMAP) window.KEYMAP.forEach(r=>r.forEach(k=>{
  if(!k.mod){
    if(!(k.lo in byChar)) byChar[k.lo]={r:k.r,c:k.c,shift:false};
    if(!(k.hi in byChar)) byChar[k.hi]={r:k.r,c:k.c,shift:true};
  }
}));
const ARROW={ArrowUp:';',ArrowDown:'.',ArrowLeft:',',ArrowRight:'/'};

// Control keys are stored in KEYMAP by LABEL ('enter','del','tab'), not as
// characters, so byChar cannot find them. Look them up by label rather than
// hardcoding coordinates -- a hardcoded {r:2,c:13} would be right today and
// silently wrong the moment the vendor moves a key.
const byLabel={};
if(window.KEYMAP) window.KEYMAP.forEach(r=>r.forEach(k=>{byLabel[k.lo]={r:k.r,c:k.c,shift:false}}));
// Shared by both capture paths below (physical keydown, and the mobile
// hidden-input relay) so a coordinate lookup only has one call site to send
// through -- see ADR 0045.
function sendSpec(spec){
  if(!spec) return false;
  noteSent(spec.r,spec.c, send({t:'key',r:spec.r,c:spec.c,shift:spec.shift,fn:false}));
  return true;
}
const mkbInput=$('mkbInput');
let hwCapture=false;
function setCapture(on){
  hwCapture=on;
  $('hwkb').classList.toggle('on',on);
  $('hwkb').textContent = on?'Capturing keys — click to stop':'Capture my keyboard';
  // The badge lives OUTSIDE the menu on purpose: this mode swallows the user's
  // real keystrokes, so its state must survive the menu closing.
  $('capbadge').classList.toggle('on',on);
  // A touch device has no physical keyboard for the block below to capture
  // keydown from. Route capture through the hidden input instead: focusing it
  // is what makes iOS show its own keyboard and start dispatching key/input
  // events at all. Blurring on stop dismisses that keyboard again.
  if(isTouch){ if(on) mkbInput.focus(); else mkbInput.blur(); }
}
$('hwkb').onclick=()=>setCapture(!hwCapture);
$('capoff').onclick=e=>{e.stopPropagation();setCapture(false)};
// Mobile relay: Backspace/Enter/Tab/arrows still arrive as real keydown even
// from iOS's on-screen keyboard once mkbInput has focus, so they're handled
// exactly like the physical path below. Ordinary characters are NOT -- iOS's
// autocorrect/predictive layer can insert or rewrite text between keystrokes,
// so those are read from the resulting `input` value instead of trusted from
// keydown, then the field is cleared so next time only sees what's new.
mkbInput.addEventListener('keydown',e=>{
  if(!hwCapture || e.isComposing) return;
  let spec=null;
  if(e.key in ARROW)           spec=byChar[ARROW[e.key]];
  else if(e.key==='Enter')     spec=byLabel['enter'];
  else if(e.key==='Backspace') spec=byLabel['del'];
  else if(e.key==='Tab')       spec=byLabel['tab'];
  else return;                 // ordinary characters fall through to 'input'
  if(sendSpec(spec)) e.preventDefault();
});
mkbInput.addEventListener('input',e=>{
  if(!hwCapture || e.isComposing) return;
  for(const ch of e.target.value) sendSpec(byChar[ch]);
  e.target.value='';
});

/* Hamburger. Closes on outside click and on Escape -- a menu that only closes
 * by re-clicking its own button strands itself over the keyboard, which is the
 * thing the user is trying to reach.
 */
const menu=$('menu'), menubtn=$('menubtn');
function setMenu(open){
  menu.hidden=!open;
  menubtn.classList.toggle('open',open);
  menubtn.setAttribute('aria-expanded', open?'true':'false');
}
menubtn.onclick=e=>{e.stopPropagation();setMenu(menu.hidden)};
menu.onclick=e=>e.stopPropagation();
addEventListener('click',()=>setMenu(false));
addEventListener('keydown',e=>{
  // Escape closes the menu -- but ONLY when capture is off. With capture on,
  // Escape belongs to the device, and stealing it would make the browser
  // silently eat a key the firmware expects.
  if(e.key==='Escape' && !hwCapture && !menu.hidden){setMenu(false)}
});
addEventListener('keydown',e=>{
  // mkbInput has its own keydown+input listeners (above) which are the only
  // handlers for anything typed there. Without this guard, every keystroke
  // bubbling up from it past this document-level listener would be sent
  // TWICE -- once from mkbInput's own handler, once from this one.
  if(!hwCapture || e.target===mkbInput) return;
  let spec=null;
  // The ADV's arrow keys are DEDICATED keys, silkscreened with arrows, that
  // report as ; , . / -- an inverted-T at (2,11)/(3,10)/(3,11)/(3,12). They are
  // NOT an fn chord. Sending fn=true here fabricated a modifier the hardware
  // never sets for these keys, and firmware that keys on fn would have rejected
  // every remote arrow press while physical presses worked.
  if(e.key in ARROW){ spec=byChar[ARROW[e.key]]; }
  else if(e.key==='Enter')     spec=byLabel['enter'];
  else if(e.key==='Backspace') spec=byLabel['del'];
  else if(e.key==='Tab')       spec=byLabel['tab'];
  else if(e.key.length===1)    spec=byChar[e.key];
  if(sendSpec(spec)) e.preventDefault();
});

</script></body></html>
